<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">NVIDIA STX / CMX 与 NetApp 上下文存储对照</title>
  <desc id="desc">G1 到 G4 存储分层中新增 G3.5 上下文层；左侧为 NetApp 标准协议路线，右侧为 NVIDIA STX / CMX 原生路线。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#e8eefb"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0067c5"/><stop offset="1" stop-color="#6f5bd6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#274264" flood-opacity=".14"/></filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#aabbd5" stroke-opacity=".18"/></pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="42" y="48" font-size="16" font-weight="800" fill="#0067c5">NVIDIA STX / CMX  vs  NETAPP</text>
    <text x="42" y="82" font-size="28" font-weight="800" fill="#182342">AI 推理上下文存储架构对照</text>
    <text x="42" y="108" font-size="13" fill="#5b6788">G3.5 上下文层 · 八层拆解 · 可复现路径 · 证据强度分级</text>

    <!-- 左：分层 -->
    <g filter="url(#shadow)"><rect x="42" y="138" width="300" height="270" rx="16" fill="#fff" stroke="#d9e0ef"/></g>
    <text x="62" y="166" font-size="12" font-weight="700" fill="#5b6788">NVIDIA 记忆层次</text>
    <rect x="62" y="178" width="260" height="34" rx="8" fill="#fdeef1" stroke="#e0a3b4"/>
    <text x="78" y="200" font-size="13" font-weight="800" fill="#d6365a">G1</text><text x="116" y="200" font-size="12" fill="#182342">GPU HBM 显存</text>
    <rect x="62" y="218" width="260" height="34" rx="8" fill="#fdf3e4" stroke="#e8c48e"/>
    <text x="78" y="240" font-size="13" font-weight="800" fill="#d97b16">G2</text><text x="116" y="240" font-size="12" fill="#182342">主机 DRAM</text>
    <rect x="62" y="258" width="260" height="34" rx="8" fill="#e9f3ff" stroke="#a8c8e7"/>
    <text x="78" y="280" font-size="13" font-weight="800" fill="#0067c5">G3</text><text x="116" y="280" font-size="12" fill="#182342">本地 SSD · 单机可见</text>
    <rect x="62" y="298" width="260" height="40" rx="8" fill="#e3f4f2" stroke="#0c8e86" stroke-width="2"/>
    <text x="78" y="323" font-size="13" font-weight="800" fill="#0c8e86">G3.5</text><text x="124" y="323" font-size="12" font-weight="700" fill="#182342">CMX 上下文层 · SU 内共享</text>
    <rect x="62" y="344" width="260" height="34" rx="8" fill="#efeafd" stroke="#a99ce8"/>
    <text x="78" y="366" font-size="13" font-weight="800" fill="#6f5bd6">G4</text><text x="116" y="366" font-size="12" fill="#182342">共享文件 / 对象存储</text>
    <text x="62" y="398" font-size="10.5" fill="#8b94b3">新增层，不取代 G4</text>

    <!-- 右：两条路线 -->
    <g filter="url(#shadow)"><rect x="366" y="138" width="190" height="270" rx="16" fill="#fff" stroke="#a8c8e7"/></g>
    <rect x="366" y="138" width="190" height="6" rx="3" fill="#0f9d63"/>
    <text x="461" y="172" text-anchor="middle" font-size="14" font-weight="800" fill="#182342">NetApp</text>
    <text x="461" y="190" text-anchor="middle" font-size="11" fill="#0f9d63">今天可复现</text>
    <g font-size="11.5" fill="#182342" text-anchor="middle">
      <rect x="386" y="204" width="150" height="30" rx="7" fill="#f5f8fd" stroke="#d9e0ef"/><text x="461" y="224">vLLM · LMCache</text>
      <rect x="386" y="242" width="150" height="30" rx="7" fill="#f5f8fd" stroke="#d9e0ef"/><text x="461" y="262">pNFS over RDMA</text>
      <rect x="386" y="280" width="150" height="30" rx="7" fill="#f5f8fd" stroke="#d9e0ef"/><text x="461" y="300">ONTAP · 文件语义</text>
    </g>
    <text x="461" y="346" text-anchor="middle" font-family="'SF Mono',Consolas,monospace" font-size="22" font-weight="800" fill="#0f9d63">+157%</text>
    <text x="461" y="366" text-anchor="middle" font-size="10.5" fill="#5b6788">对 GPU＋CPU 卸载（最高）</text>
    <rect x="410" y="380" width="102" height="18" rx="9" fill="#e6f6ee"/><text x="461" y="393" text-anchor="middle" font-size="10" font-weight="700" fill="#0f9d63">已公开验证</text>

    <g filter="url(#shadow)"><rect x="574" y="138" width="190" height="270" rx="16" fill="#fff" stroke="#c9bff0"/></g>
    <rect x="574" y="138" width="190" height="6" rx="3" fill="url(#brand)"/>
    <text x="669" y="172" text-anchor="middle" font-size="14" font-weight="800" fill="#182342">STX / CMX</text>
    <text x="669" y="190" text-anchor="middle" font-size="11" fill="#d97b16">2026 下半年</text>
    <g font-size="11.5" fill="#182342" text-anchor="middle">
      <rect x="594" y="204" width="150" height="30" rx="7" fill="#f5f8fd" stroke="#d9e0ef"/><text x="669" y="224">Dynamo · KVBM</text>
      <rect x="594" y="242" width="150" height="30" rx="7" fill="#f5f8fd" stroke="#d9e0ef"/><text x="669" y="262">NIXL · DOCA Memos</text>
      <rect x="594" y="280" width="150" height="30" rx="7" fill="#f5f8fd" stroke="#d9e0ef"/><text x="669" y="300">BlueField-4 · KV 语义</text>
    </g>
    <text x="669" y="346" text-anchor="middle" font-family="'SF Mono',Consolas,monospace" font-size="22" font-weight="800" fill="#6f5bd6">0 家 GA</text>
    <text x="669" y="366" text-anchor="middle" font-size="10.5" fill="#5b6788">截至 2026-10-17</text>
    <rect x="618" y="380" width="102" height="18" rx="9" fill="#fdf3e4"/><text x="669" y="393" text-anchor="middle" font-size="10" font-weight="700" fill="#d97b16">已宣布</text>
  </g>
</svg>
