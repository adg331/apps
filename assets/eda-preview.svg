<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">EDA 数据流与 NetApp AFX</title>
  <desc id="d">芯片设计从前端到后端的八个阶段，计算农场经 pNFS 访问 AFX 控制器节点，数据存放在共享存储池 SAZ。</desc>
