    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0067c5"/><stop offset="1" stop-color="#19b1e6"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dy="10" stdDeviation="12" flood-color="#294e72" flood-opacity=".14"/></filter>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#78a9d3" stroke-opacity=".11"/></pattern>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#0e93c9"/></marker>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
