  <text x="42" y="82" font-size="28" font-weight="800" fill="#182342">AI 工厂存储架构</text>
  <text x="42" y="108" font-size="13" fill="#5b6788">元数据与数据解耦 · 标准 pNFS 直连 · 单一命名空间</text>
  <text x="758" y="48" text-anchor="end" font-size="12" font-weight="700" fill="#6a5ad4">INSIGHT 2026</text>
