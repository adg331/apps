<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">NetApp Novus 元数据与数据解耦架构</title>
  <desc id="desc">GPU 客户端从 Novus Data Director 取得布局后，经标准 pNFS 并行直连基于 ONTAP 的数据节点，全部节点位于一个命名空间下。</desc>
