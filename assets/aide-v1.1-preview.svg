<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">NetApp AIDE 1.1 统一元数据目录</title>
  <desc id="desc">AIDE 以纯软件形态经 NFS、SMB、S3 与数据库协议扫描总部、分厂、云上和生产数据库，汇入同一个元数据目录，回答有哪些、在哪里、归谁、还用不用。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#e8eefb"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0067c5"/><stop offset="1" stop-color="#0d8a86"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#274264" flood-opacity=".14"/></filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#aabbd5" stroke-opacity=".18"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0067c5"/></marker>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <text x="42" y="48" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="800" fill="#0067c5">NETAPP AIDE 1.1</text>
  <text x="42" y="82" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="800" fill="#182342">全企业的统一元数据目录</text>
  <text x="42" y="108" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5b6788">纯软件部署 · 标准协议接入 · 就地扫描 · 数据不离开本地</text>

  <g filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="42" y="140" width="190" height="52" rx="11" fill="#fff" stroke="#a8c8e7"/>
    <rect x="42" y="140" width="12" height="52" rx="6" fill="#0067c5"/>
    <text x="72" y="162" font-size="13" font-weight="800" fill="#182342">总部 ONTAP</text><text x="72" y="180" font-size="11" fill="#5b6788">NFS · SMB</text>

    <rect x="42" y="204" width="190" height="52" rx="11" fill="#fff" stroke="#9fd3d0"/>
    <rect x="42" y="204" width="12" height="52" rx="6" fill="#0d8a86"/>
    <text x="72" y="226" font-size="13" font-weight="800" fill="#182342">分厂第三方 NAS</text><text x="72" y="244" font-size="11" fill="#5b6788">NFS · SMB</text>

    <rect x="42" y="268" width="190" height="52" rx="11" fill="#fff" stroke="#e6ad67"/>
    <rect x="42" y="268" width="12" height="52" rx="6" fill="#d97b16"/>
    <text x="72" y="290" font-size="13" font-weight="800" fill="#182342">云上对象存储桶</text><text x="72" y="308" font-size="11" fill="#5b6788">S3</text>

    <rect x="42" y="332" width="190" height="52" rx="11" fill="#fff" stroke="#b9aeea"/>
    <rect x="42" y="332" width="12" height="52" rx="6" fill="#6f5bd6"/>
    <text x="72" y="354" font-size="13" font-weight="800" fill="#182342">生产数据库</text><text x="72" y="372" font-size="11" fill="#5b6788">Schema · 表</text>
  </g>

  <g stroke="#0067c5" stroke-width="2.5" fill="none">
    <path d="M238 166C260 166 252 262 274 262"/>
    <path d="M238 230C258 230 254 262 274 262"/>
    <path d="M238 294C258 294 254 262 274 262"/>
    <path d="M238 358C260 358 252 262 274 262"/>
    <path d="M274 262H304" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <circle cx="274" cy="262" r="4.5" fill="#0067c5"/>

  <g filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="316" y="150" width="200" height="224" rx="16" fill="#fff" stroke="#a8c8e7"/>
    <rect x="336" y="170" width="160" height="64" rx="12" fill="url(#brand)"/>
    <text x="416" y="198" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">AIDE</text>
    <text x="416" y="219" text-anchor="middle" font-size="11" fill="#fff" fill-opacity=".9">Metadata Engine</text>
    <text x="416" y="262" text-anchor="middle" font-size="14" font-weight="800" fill="#182342">统一元数据目录</text>
    <g font-size="11" fill="#5b6788">
      <text x="416" y="286" text-anchor="middle">路径 · 大小 · 时间戳</text>
      <text x="416" y="305" text-anchor="middle">属主 · 权限 · 哈希 · 标签</text>
    </g>
    <path d="M346 330H486" stroke="#d9e0ef" stroke-width="5" stroke-linecap="round"/>
    <path d="M346 330H440" stroke="#0d8a86" stroke-width="5" stroke-linecap="round"/>
    <text x="416" y="354" text-anchor="middle" font-size="11" fill="#0d8a86">循环扫描中</text>
  </g>

  <path d="M524 262H562" stroke="#0067c5" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="576" y="140" width="176" height="52" rx="11" fill="#fff" stroke="#a8c8e7"/>
    <text x="596" y="172" font-size="15" font-weight="800" fill="#0067c5">有哪些？</text>
    <rect x="576" y="204" width="176" height="52" rx="11" fill="#fff" stroke="#9fd3d0"/>
    <text x="596" y="236" font-size="15" font-weight="800" fill="#0d8a86">在哪里？</text>
    <rect x="576" y="268" width="176" height="52" rx="11" fill="#fff" stroke="#e6ad67"/>
    <text x="596" y="300" font-size="15" font-weight="800" fill="#d97b16">归谁？</text>
    <rect x="576" y="332" width="176" height="52" rx="11" fill="#fff" stroke="#b9aeea"/>
    <text x="596" y="364" font-size="15" font-weight="800" fill="#6f5bd6">还用不用？</text>
  </g>

  <rect x="590" y="31" width="162" height="38" rx="19" fill="#fff" stroke="#b8cce1"/>
  <circle cx="612" cy="50" r="6" fill="#0f9d63"/>
  <text x="628" y="55" font-family="sans-serif" font-size="11" font-weight="700" fill="#31516c">INTERACTIVE DEMO</text>
</svg>
